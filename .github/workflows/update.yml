name: Update official closing prices

on:
  workflow_dispatch:
  schedule:
    # Use an explicit Taiwan timezone; reject late overnight scheduled runs below.
    - cron: '0 16 * * 1-5'
      timezone: 'Asia/Taipei'

permissions:
  contents: write

concurrency:
  group: stock-data-refresh
  cancel-in-progress: false

jobs:
  schedule_window:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    steps:
      - name: Check actual Taiwan execution time
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const now = new Date();
          const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Taipei',weekday:'short',hour:'2-digit',hourCycle:'h23'}).formatToParts(now).map(p=>[p.type,p.value]));
          const allowed = process.env.EVENT_NAME !== 'schedule' || (['Mon','Tue','Wed','Thu','Fri'].includes(parts.weekday) && parts.hour === '16');
          const message = 'Taipei execution time: ' + new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Taipei',dateStyle:'short',timeStyle:'medium'}).format(now);
          console.log(message);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'allowed=' + allowed + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n\n' + (allowed ? 'Refresh allowed.' : 'Scheduled refresh skipped: outside Taipei weekday 16:00-16:59. No data will be changed. Use workflow_dispatch for a manual retry.') + '\n');
          if (!allowed) console.log('::warning::Late scheduled run skipped; data refresh is limited to Taipei weekday 16:00-16:59.');
          NODE
  refresh:
    needs: schedule_window
    if: github.ref == 'refs/heads/main' && needs.schedule_window.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test updater
        run: npm test
      - name: Fetch and validate official prices
        run: npm run refresh
      - name: Update market indices
        id: market
        continue-on-error: true
        run: npm run refresh:market
      - name: Update historical OHLC and volume
        # A history outage must not stop the existing closing-price publication.
        continue-on-error: true
        run: npm run refresh:history
      - name: Update official ex-right and ex-dividend announcements
        id: dividends
        continue-on-error: true
        run: npm run refresh:dividends
      - name: Commit only the updated JSON
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- closing-prices.json
          if [ -f market-indices.json ]; then git add -- market-indices.json; fi
          if [ -f ex-dividends.json ]; then git add -- ex-dividends.json; fi
          if [ -d history ]; then git add -- history/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update official closing prices'
          git push origin HEAD:main
      - name: Report market update failure after publishing available data
        if: always() && steps.market.outcome == 'failure'
        run: |
          echo '::error::Market index update failed; available stock data was preserved/published.'
          exit 1
      - name: Report announcement update failure after publishing available data
        if: always() && steps.dividends.outcome == 'failure'
        run: |
          echo '::error::Ex-dividend announcement update failed; available data was preserved/published.'
          exit 1
