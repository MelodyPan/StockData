name: Update official closing prices

on:
  workflow_dispatch:
  schedule:
    # Taiwan time, Monday to Friday at 16:45.
    - cron: '45 16 * * 1-5'
      timezone: 'Asia/Taipei'

permissions:
  contents: write

concurrency:
  group: stock-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test updater
        run: npm test
      - name: Fetch and validate official prices
        run: npm run refresh
      - name: Update historical OHLC and volume
        # A history outage must not stop the existing closing-price publication.
        continue-on-error: true
        run: npm run refresh:history
      - name: Commit only the updated JSON
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- closing-prices.json
          if [ -d history ]; then git add -- history/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update official closing prices'
          git push origin HEAD:main
